name: Frontend Build

on:
  workflow_dispatch:
  push:
    branches: [main, landing-page-v6]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build
